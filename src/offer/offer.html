<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Connect ContainMarks</title>
		<style>
			:root {
				color-scheme: light dark;
				--page: #f9f9fa;
				--card: #ffffff;
				--text: #15141a;
				--muted: #5b5b66;
				--line: #d7d7db;
				--accent: #0061e0;
				--accent-text: #ffffff;
				--quiet: #e7e7ea;
				font: 15px/1.5 system-ui, sans-serif;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--page: #1c1b22;
					--card: #2b2a33;
					--text: #fbfbfe;
					--muted: #b0b0bb;
					--line: #4a4a55;
					--accent: #00ddff;
					--accent-text: #15141a;
					--quiet: #42414d;
				}
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 16px;
				background: var(--page);
				color: var(--text);
			}
			main {
				width: 100%;
				max-width: 460px;
				padding: 28px;
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 12px;
			}
			h1 { margin: 0 0 12px; font-size: 20px; line-height: 1.3; }
			p { margin: 0 0 12px; color: var(--muted); }
			#offer-status { color: var(--text); font-weight: 600; }
			#offer-status:empty { display: none; }
			.actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
			button {
				flex: 1 1 140px;
				min-height: 40px;
				padding: 8px 16px;
				border: 0;
				border-radius: 6px;
				font: inherit;
				font-weight: 600;
				color: var(--text);
				background: var(--quiet);
				cursor: pointer;
			}
			button.primary { color: var(--accent-text); background: var(--accent); }
			button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
			button:disabled { opacity: 0.6; cursor: default; }
		</style>
	</head>
	<body>
		<main>
			<h1 id="offer-title">Connect ContainMarks to Temporary Containers?</h1>
			<p id="offer-body">Connect the extensions so your container bookmarks open directly, with fewer extra tabs and delays.</p>
			<p>Temporary Containers asks for your approval next, and nothing changes until you give it. You can connect later in ContainMarks settings.</p>
			<p id="offer-status" role="status"></p>
			<div class="actions" id="offer-actions">
				<button type="button" id="offer-connect" class="primary">Connect</button>
				<button type="button" id="offer-decline">No thanks</button>
			</div>
		</main>
		<script src="offer.js"></script>
	</body>
</html>
