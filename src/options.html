<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ContainMarks Settings</title>
		<style>
			:root {
				font-family: system-ui, sans-serif;
			}
			body {
				margin: 0;
				padding: 20px;
				background: #f7f7f9;
				color: #1f2328;
			}
			main {
				max-width: 720px;
				margin: 0 auto;
				background: white;
				padding: 20px;
				border: 1px solid #e1e4e8;
				border-radius: 10px;
			}
			fieldset {
				border: 1px solid #e1e4e8;
				border-radius: 8px;
				margin-bottom: 16px;
				padding: 14px;
			}
			label {
				display: block;
				margin-bottom: 10px;
			}
			select,
			button {
				font: inherit;
			}
			button {
				padding: 8px 14px;
				border-radius: 8px;
				border: 1px solid #d0d7de;
				background: #f6f8fa;
				cursor: pointer;
			}
			#save-status {
				min-height: 20px;
			}
			dialog {
				border: 1px solid #d0d7de;
				border-radius: 10px;
				padding: 20px;
				max-width: 480px;
			}
			dialog::backdrop {
				background: rgba(0, 0, 0, 0.4);
			}
			dialog ul {
				background: #f6f8fa;
				padding: 10px 10px 10px 30px;
				border-radius: 6px;
				max-height: 300px;
				overflow-y: auto;
			}
			dialog menu {
				display: flex;
				justify-content: flex-end;
				gap: 8px;
				padding: 0;
				margin: 12px 0 0;
			}
			dialog .overwrite {
				background: #f85149;
				border-color: #f85149;
				color: white;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>ContainMarks Settings</h1>
			<form id="options-form">
				<fieldset>
					<legend>Bookmark Target</legend>
					<label for="target-folder">Target folder for page-action bookmark creation</label>
					<select id="target-folder" required></select>
				</fieldset>

				<fieldset>
					<legend>Token Retention Policies</legend>
					<label>
						<input type="checkbox" id="ack-risks" />
						I understand the <a id="risk-link" target="_blank" rel="noopener noreferrer">risks</a>.
					</label>
					<label>
						<input type="checkbox" id="reset-tokens-on-startup" />
						Reset tokens on startup
					</label>
					<label>
						<input type="checkbox" id="regenerate-token-on-use" checked />
						Regenerate token on every use
					</label>
				</fieldset>

				<fieldset>
					<legend>Runtime Behavior</legend>
					<label>
						<input type="checkbox" id="show-page-action-button" checked />
						Show the "Bookmark this URL inside this container" button
					</label>
					<label>
						<input type="checkbox" id="enable-bookmark-sync" checked />
						Enable bookmark synchronization across devices
					</label>
					<button type="button" id="translate-mappings-button"></button>
					<p id="translate-mappings-description">
						This will OVERWRITE the <strong id="translate-target-label"></strong> container mappings, but will not erase the
						<strong id="translate-source-label"></strong> container mappings.
					</p>
				</fieldset>

				<button type="submit">Save Settings</button>
				<p id="save-status" aria-live="polite"></p>
			</form>
		</main>
		<script src="options.js"></script>
		<dialog id="confirm-transfer-dialog">
			<h2>Overwrite container mappings?</h2>
			<p>This cannot be undone. The final mappings will be:</p>
			<ul id="confirm-transfer-preview"></ul>
			<menu>
				<button id="confirm-transfer-cancel" type="button">Cancel</button>
				<button id="confirm-transfer-ok" type="button" class="overwrite">Overwrite</button>
			</menu>
		</dialog>
	</body>
</html>
